name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...

  crosscompile:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -o /dev/null ./cmd/watchpickr

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Single platform first, so the image can be loaded and run below.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: watchpickr:ci

      - name: The demo starts with no configuration at all
        run: |
          docker run -d --name demo -p 8080:8080 watchpickr:ci -demo
          .github/wait-for.sh http://localhost:8080/healthz
          curl -fsS http://localhost:8080/podium | grep -q "Everything Everywhere"
          docker rm -f demo

      - name: Production starts with only a password
        run: |
          docker run -d --name prod -p 8081:8080 \
            -e WATCHPICKR_ADMIN_PASSWORD=a-long-enough-password watchpickr:ci
          .github/wait-for.sh http://localhost:8081/healthz
          curl -fsS -o /dev/null http://localhost:8081/login
          docker rm -f prod

      # No QEMU needed, the Dockerfile cross-compiles.
      - name: Both architectures build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
